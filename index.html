<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header">
    <h1>My Gallery</h1>
    <p>Hover over a picture, then click it.</p>
  </header>

  <main class="gallery">

    <!--
      ONE TILE = one <a> link that contains TWO images.
        - href          -> the page that opens when clicked
        - img-default   -> the image you see normally
        - img-hover     -> the image that fades in on hover
        - label         -> the caption that slides up
      To add a tile: copy a whole <a>...</a> block and change
      the href, both image paths, the alt text and the label.
    -->
    <a class="tile" href="page-1.html">
      <img class="img-default" src="images/tile1-normal.jpg" alt="Describe the normal image">
      <img class="img-hover"   src="images/tile1-hover.jpg"  alt="Describe the hover image">
      <span class="label">First tile</span>
    </a>

    <a class="tile" href="page-2.html">
      <img class="img-default" src="images/tile2-normal.jpg" alt="Describe the normal image">
      <img class="img-hover"   src="images/tile2-hover.jpg"  alt="Describe the hover image">
      <span class="label">Second tile</span>
    </a>

    <a class="tile" href="page-3.html">
      <img class="img-default" src="images/tile3-normal.jpg" alt="Describe the normal image">
      <img class="img-hover"   src="images/tile3-hover.jpg"  alt="Describe the hover image">
      <span class="label">Third tile</span>
    </a>

    <a class="tile" href="page-4.html">
      <img class="img-default" src="images/tile4-normal.jpg" alt="Describe the normal image">
      <img class="img-hover"   src="images/tile4-hover.jpg"  alt="Describe the hover image">
      <span class="label">Fourth tile</span>
    </a>

  </main>

</body>
</html>
