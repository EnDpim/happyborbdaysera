<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        /* If the visitor already opened the envelope in this tab, skip the entry screen */
        try {if (sessionStorage.getItem("entered")) document.documentElement.classList.add("skip-entry");} catch (e) { }
    </script>
    <script src="js/main.js" defer></script>
    <script src="js/dots.js" defer></script>
    <script src="js/music.js" defer></script>
    <script src="js/entry.js" defer></script>
</head>

<body>

    <div class="dots"></div>
    <header class="intro">
        <h1>Happy borbday seruru</h1>
        <p>Hey sera happy birthday</p>
    </header>

    <main class="map">

        <!-- An empty layer. main.js fills it with the dotted trail. -->
        <div class="trail"></div>

        <!-- The milestones, from top to bottom. The trail passes through
         each one in this order. Copy a block to add another. -->
        <a class="tile" href="page-1.html">
            <img class="img-default" src="assets/images/tile1-normal.png" alt="">
            <img class="img-hover" src="assets/images/tile1-hover.png" alt="">
            <span class="note">Your short text here</span>
        </a>

        <a class="tile" href="page-2.html">
            <img class="img-default" src="assets/images/tile2-normal.png" alt="">
            <img class="img-hover" src="assets/images/tile2-hover.png" alt="">
            <span class="note">Your short text here</span>
        </a>

        <a class="tile" href="page-3.html">
            <img class="img-default" src="assets/images/tile3-normal.png" alt="">
            <img class="img-hover" src="assets/images/tile3-hover.png" alt="">
            <span class="note">Your short text here</span>
        </a>

    </main>

    <div class="entry" id="entry">
        <button class="entry-envelope" id="entry-button" type="button" aria-label="Open the envelope">
            <img class="entry-closed" src="assets/images/entry-closed.png" alt="">
            <img class="entry-open" src="assets/images/entry-open.png" alt="">
        </button>
        <p class="entry-hint">Click the envelope to open it</p>
    </div>

    <audio id="bgm" src="assets/audio/song.mp3" loop preload="auto"></audio>
    <button id="music-toggle" class="music-toggle" type="button" aria-label="Play music">
        <img id="music-icon" src="assets/images/play.png" alt="">
    </button>
</body>

</html>
